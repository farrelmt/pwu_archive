<!DOCTYPE html>
<html lang="id">
{% load static tailwind_tags %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172554">
    <title>PWU Jatim - Pilih Sistem</title>
    <meta name="description" content="Portal sistem informasi PT. Panca Wira Usaha Jawa Timur.">
    <link rel="icon" type="image/png" href="{% static 'images/wirajatim-logo-stacked.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/wirajatim-logo-stacked.png' %}">
    {% tailwind_css %}
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-5 py-12">
        <div class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-blue-200/50 blur-3xl"></div>
        <div class="absolute -bottom-40 -right-28 h-[28rem] w-[28rem] rounded-full bg-green-200/40 blur-3xl"></div>

        <section class="relative w-full max-w-4xl text-center">
            <img src="{% static 'images/wirajatim-logo-horizontal.png' %}"
                 alt="Wira Jatim Group"
                 class="mx-auto h-14 w-auto max-w-full object-contain sm:h-20">

            <h1 class="mt-8 text-l font-extrabold tracking-tight text-blue-950 sm:text-5xl">
                Portal Sistem Informasi PWU Jatim
            </h1>

            <div class="mt-10 grid gap-5 sm:grid-cols-2">
                <a href="{{ archive_url }}"
                   class="group flex min-h-52 flex-col items-center justify-center rounded-3xl border border-blue-200 bg-white p-7 shadow-lg shadow-blue-950/5 transition duration-200 hover:-translate-y-1 hover:border-blue-400 hover:shadow-2xl hover:shadow-blue-950/10 focus:outline-none focus:ring-4 focus:ring-blue-200">
                    <span class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-950 text-white transition group-hover:bg-blue-800">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="h-8 w-8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75 12 12l8.25-5.25M4.5 19.5h15A1.5 1.5 0 0 0 21 18V6a1.5 1.5 0 0 0-1.5-1.5h-15A1.5 1.5 0 0 0 3 6v12a1.5 1.5 0 0 0 1.5 1.5Z"/>
                        </svg>
                    </span>
                    <h2 class="mt-5 text-xl font-bold text-blue-950">Sistem Arsip</h2>
                    <p class="mt-2 text-sm leading-6 text-slate-500">Surat, disposisi, dan pemantauan dokumen.</p>
                </a>

                <a href="{{ koperasi_url }}"
                   class="group flex min-h-52 flex-col items-center justify-center rounded-3xl border border-green-200 bg-white p-7 shadow-lg shadow-green-950/5 transition duration-200 hover:-translate-y-1 hover:border-green-400 hover:shadow-2xl hover:shadow-green-950/10 focus:outline-none focus:ring-4 focus:ring-green-200">
                    <span class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-green-600 text-white transition group-hover:bg-green-700">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="h-8 w-8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.189 1.453-.353 1.453-1.103V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125h17.25c.621 0 1.125.504 1.125 1.125V6M2.25 6v9m19.5-9v9m0 0v.75c0 .621-.504 1.125-1.125 1.125H3.375A1.125 1.125 0 0 1 2.25 15.75V15m19.5 0h-.75a.75.75 0 0 1-.75-.75v-.75m-18 1.5H3a.75.75 0 0 0 .75-.75v-.75m12-3a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
                        </svg>
                    </span>
                    <h2 class="mt-5 text-xl font-bold text-green-800">Sistem Koperasi</h2>
                    <p class="mt-2 text-sm leading-6 text-slate-500">Layanan dan pengelolaan koperasi perusahaan.</p>

                </a>
            </div>

            <p class="mt-10 text-xs text-slate-400">&copy; {% now "Y" %} PT. Panca Wira Usaha Jawa Timur</p>
        </section>
    </main>
</body>
</html>
