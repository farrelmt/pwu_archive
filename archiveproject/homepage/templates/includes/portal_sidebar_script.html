    <script nonce="{{ request.csp_nonce }}">
        (()=>{const sidebar=document.getElementById('portalSidebar'),collapse=document.getElementById('portalCollapse'),mobile=document.getElementById('portalMobileToggle'),backdrop=document.getElementById('portalBackdrop');const setCollapsed=(value)=>{sidebar.classList.toggle('is-collapsed',value);collapse?.setAttribute('aria-expanded',String(!value));collapse?.setAttribute('aria-label',value?'Buka sidebar':'Tutup sidebar');localStorage.setItem('portalSidebarCollapsed',value?'1':'0')};if(window.innerWidth>=768)setCollapsed(localStorage.getItem('portalSidebarCollapsed')==='1');collapse?.addEventListener('click',()=>setCollapsed(!sidebar.classList.contains('is-collapsed')));const setMobile=(open)=>{sidebar.classList.toggle('is-mobile-open',open);backdrop.classList.toggle('hidden',!open);mobile.setAttribute('aria-expanded',String(open))};mobile?.addEventListener('click',()=>setMobile(!sidebar.classList.contains('is-mobile-open')));backdrop?.addEventListener('click',()=>setMobile(false));})();
    </script>
