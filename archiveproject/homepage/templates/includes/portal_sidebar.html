    <button id="portalMobileToggle" type="button" class="fixed left-4 top-4 z-40 inline-flex h-11 w-11 items-center justify-center rounded-xl bg-blue-900 text-white shadow-lg md:hidden" aria-label="Buka menu" aria-controls="portalSidebar" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-6 w-6"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

            <div class="sidebar-brand min-w-0 flex-1">
                <span class="sidebar-copy block truncate text-sm font-extrabold tracking-wide">PORTAL PWU JATIM</span>
            </div>
            <button id="portalCollapse" type="button" class="sidebar-collapse hidden h-14 w-9 shrink-0 items-center justify-center rounded-lg text-blue-100 hover:bg-white/15 hover:text-white md:inline-flex" aria-label="Tutup sidebar" aria-expanded="true">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
            </button>
        </div>

        <div class="m-3 flex items-center gap-3 rounded-2xl border border-blue-100 bg-gradient-to-br from-blue-50 to-white p-3 shadow-sm">
            <span class="inline-flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-blue-800 text-lg font-extrabold text-white shadow-md shadow-blue-900/20">{{ request.user.get_full_name|default:request.user.username|first|upper }}</span>
            <div class="sidebar-copy min-w-0"><p class="truncate text-sm font-extrabold text-slate-900">{{ request.user.get_full_name|default:request.user.username }}</p><p class="truncate text-xs font-medium text-slate-500">@{{ request.user.username }}</p></div>
        </div>

        <nav class="flex-1 space-y-1 p-3">
            <p class="sidebar-copy mb-2 px-3 text-[10px] font-extrabold uppercase tracking-[.2em] text-slate-400">Akun &amp; Akses</p>
            <a href="{% url 'homepage:dashboard' %}" class="portal-nav-link{% if active_page == 'home' %} portal-nav-active{% endif %}" title="Beranda"{% if active_page == "home" %} aria-current="page"{% endif %}>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5 shrink-0" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg>
                <span class="sidebar-copy">Beranda</span>

                <span class="sidebar-copy">Pengaturan</span>
            </a>
            {% if can_manage_members %}
            <a href="{% url 'homepage:member_list' %}" class="portal-nav-link{% if active_page == 'members' %} portal-nav-active{% endif %}" title="Kelola Member"{% if active_page == "members" %} aria-current="page"{% endif %}>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.1a9 9 0 0 0 3.75.78 8.96 8.96 0 0 0 4.01-.94 4.5 4.5 0 0 0-6.76-3.9M15 19.1v-.01c0-1.45-.37-2.82-1.02-4.01M15 19.1v.1A12.3 12.3 0 0 1 8.25 21c-2.4 0-4.65-.68-6.55-1.86v-.1a6.75 6.75 0 0 1 12.28-3.96M12 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Zm8.25 2.25a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                <span class="sidebar-copy">Kelola Member</span>
            </a>
            {% endif %}
        </nav>

        <div class="border-t border-slate-200 p-3">
            <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="portal-nav-link w-full text-red-700 hover:bg-red-50 hover:text-red-800" title="Keluar"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-7.5A2.25 2.25 0 0 0 3.75 5.25v13.5A2.25 2.25 0 0 0 6 21h7.5a2.25 2.25 0 0 0 2.25-2.25V15M18 8.25 21.75 12 18 15.75M21 12H9"/></svg><span class="sidebar-copy">Keluar</span></button></form>
        </div>
    </aside>
