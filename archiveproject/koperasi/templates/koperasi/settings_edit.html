{% extends "koperasi/base.html" %}
{% block title %}Edit Profil - Sistem Koperasi PWU{% endblock %}
{% block content %}
<div class="mx-auto max-w-4xl">
    <div class="mb-6">
        <h1 class="text-3xl font-extrabold text-slate-900">Edit Profil</h1>
        <p class="mt-2 text-sm text-slate-500">Perbarui informasi akun atau ganti password Anda.</p>
    </div>

    <form method="post" class="space-y-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
        {% csrf_token %}
        <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">Username</label>
            <input value="{{ user.username }}" disabled class="h-12 w-full rounded-xl border border-slate-200 bg-slate-100 px-4 text-slate-500 sm:max-w-xl">
        </div>
        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="first_name" class="mb-2 block text-sm font-semibold text-slate-700">Nama Depan</label>
                <input id="first_name" name="first_name" value="{{ user.first_name }}" required class="h-12 w-full rounded-xl border border-slate-300 px-4 focus:border-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-100">
            </div>
            <div>
                <label for="last_name" class="mb-2 block text-sm font-semibold text-slate-700">Nama Belakang</label>
                <input id="last_name" name="last_name" value="{{ user.last_name }}" required class="h-12 w-full rounded-xl border border-slate-300 px-4 focus:border-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-100">
            </div>
        </div>
        <div>
            <label for="user_email" class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
            <input id="user_email" type="email" name="user_email" value="{{ user.email }}" required class="h-12 w-full rounded-xl border border-slate-300 px-4 focus:border-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-100 sm:max-w-xl">
        </div>

        <div class="border-t border-slate-200 pt-6">
            <h2 class="font-bold text-slate-900">Ganti Password</h2>
            <p class="mt-1 text-sm text-slate-500">Kosongkan bagian ini jika tidak ingin mengganti password.</p>
            <div class="mt-5 grid gap-5 lg:grid-cols-3">
                <div>
                    <label for="current_password" class="mb-2 block text-sm font-semibold text-slate-700">Password Saat Ini</label>
                    <input id="current_password" type="password" name="current-password" autocomplete="current-password" class="h-12 w-full rounded-xl border border-slate-300 px-4 focus:border-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-100">
                </div>
                <div>
                    <label for="new_password" class="mb-2 block text-sm font-semibold text-slate-700">Password Baru</label>
                    <input id="new_password" type="password" name="new-password" autocomplete="new-password" class="h-12 w-full rounded-xl border border-slate-300 px-4 focus:border-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-100">
                </div>
                <div>
                    <label for="confirm_password" class="mb-2 block text-sm font-semibold text-slate-700">Ulangi Password Baru</label>
                    <input id="confirm_password" type="password" name="confirm-password" autocomplete="new-password" class="h-12 w-full rounded-xl border border-slate-300 px-4 focus:border-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-100">
                </div>
            </div>
        </div>

        <div class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-6 sm:flex-row sm:justify-end">
            <a href="{% url 'pengaturan:main' %}" class="inline-flex h-12 items-center justify-center rounded-xl border border-slate-300 px-5 text-sm font-bold text-slate-700 hover:bg-slate-50">Batal</a>
            <button type="submit" class="inline-flex h-12 items-center justify-center rounded-xl bg-emerald-700 px-5 text-sm font-bold text-white hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-200">Simpan Perubahan</button>
        </div>
    </form>
</div>
{% endblock %}
