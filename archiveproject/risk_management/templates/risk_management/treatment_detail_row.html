<tr id="new-treatment-row" {% if not treatment_form.errors %}hidden{% endif %}>
    <td colspan="10" class="bg-blue-50">
        <form method="post" action="{% url 'risk:risk_detail' risk.pk %}#perlakuan-risiko" class="space-y-4 p-3">
            {% csrf_token %}
            <input type="hidden" name="save_treatment" value="1">
            {{ treatment_form.risk }}
            <h3 class="font-bold text-blue-900">Tambah Perlakuan Risiko</h3>
            {% if treatment_form.non_field_errors %}<div class="text-sm text-red-700">{{ treatment_form.non_field_errors }}</div>{% endif %}
            <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
                {% for field in treatment_form.visible_fields %}
                    <label class="block text-xs font-semibold text-slate-700">{{ field.label }}{{ field }}{% if field.errors %}<span class="block text-red-700">{{ field.errors }}</span>{% endif %}</label>
                {% endfor %}
            </div>
            <div class="flex gap-3">
                <button type="submit" class="rounded-xl bg-blue-700 px-4 py-2 text-sm font-bold text-white">Simpan Perlakuan</button>
                <button type="button" data-cancel-treatment class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-bold">Batal</button>
            </div>
        </form>
    </td>
</tr>
