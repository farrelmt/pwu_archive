<div data-inventory-field data-location-field data-physical-only {% if form.section == 'software' %}hidden{% endif %} class="inventory-location-field md:col-span-2">
    <div class="inventory-location-heading">
        <span class="inventory-location-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="22" height="22">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
                <circle cx="12" cy="10" r="2.5"/>
            </svg>
        </span>
        <span>
            <label class="inventory-location-label" for="{{ form.location.id_for_label }}">{{ form.location.label }}</label>
            <span id="inventory-location-help" class="inventory-location-help">Cari nama ruangan atau area tempat barang disimpan.</span>
        </span>
    </div>
    <div class="inventory-location-control">
        {{ form.location }}
        <div class="inventory-location-combobox" hidden>
            <div class="inventory-location-search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="19" height="19" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path stroke-linecap="round" d="m16 16 4.5 4.5"/></svg>
                <input type="search" class="inventory-location-search" placeholder="Cari lokasi..." autocomplete="off" role="combobox" aria-label="Cari lokasi" aria-autocomplete="list" aria-expanded="false" aria-controls="inventory-location-results" aria-describedby="inventory-location-help">
                <span class="inventory-location-search-chevron" aria-hidden="true">⌄</span>
            </div>
            <div id="inventory-location-results" class="inventory-location-results" role="listbox" hidden></div>
        </div>
    </div>
    {% for error in form.location.errors %}<p class="mt-2 text-xs font-semibold text-red-600">{{ error }}</p>{% endfor %}
</div>
