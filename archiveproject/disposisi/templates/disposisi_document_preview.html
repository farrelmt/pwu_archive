<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Disposisi - {{ disposisi.nomor_agenda }}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: #1e3a5f;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            min-height: 54px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 16px;
            background: #0f2a4d;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .document-info {
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-size: 1rem;
        }

        .filename {
            display: block;
            max-width: 55vw;
            margin-top: 3px;
            overflow: hidden;
            color: #cbd5e1;
            font-size: 0.75rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions {
            display: flex;
            flex-shrink: 0;
            gap: 8px;
        }

        .button {
            display: inline-flex;
            min-height: 36px;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            border: 1px solid #fff;
            border-radius: 5px;
            color: #fff;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
        }

        .button.primary {
            border-color: #eab308;
            background: #eab308;
            color: #111827;
        }

        main {
            flex: 1;
            min-height: 0;
            padding: 12px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .filename {
                max-width: 90vw;
            }

            .actions {
                width: 100%;
            }

            .button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="document-info">
            <h1>Preview Disposisi {{ disposisi.nomor_agenda }}</h1>
            <span class="filename">{{ filename }}</span>
        </div>
        <div class="actions">
            <a class="button" href="{% url 'disposisi:detaildisposisi' disposisi.pk %}">
                Kembali
            </a>
            <a class="button primary"
               href="{% url 'disposisi:download_uploaded_disposisi' disposisi.pk %}">
                Download
            </a>
        </div>
    </header>
    <main>
        <iframe
            src="{% url 'disposisi:view_uploaded_disposisi' disposisi.pk %}"
            title="Dokumen disposisi {{ disposisi.nomor_agenda }}"
        ></iframe>
    </main>
</body>
</html>
